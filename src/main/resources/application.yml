# 止盈盈利 = 开仓保证金 × margin-ratio。资金费净亏损会再加进目标，净盈利不改变止盈价
take-profit:
  margin-ratio: 0.10

# 开仓挂单价格和现价相差超过该比例则撤单。0.05 表示 5%
open-order:
  max-price-diff: 0.01
  # 同时持有的合约个数。未成交的第一笔开仓单也占一个名额
  max-positions: 2
  margin: 100
  leverage: 10
  price-offset: 0.001
  # 相对第一单价格每下跌该比例，再用同样保证金加一笔多单。0.10 表示 10%
  add-drop: 0.10
  # 每个多单最多加仓次数，不含第一笔开仓。2 表示最多再加两档
  max-adds: 2

